[project]
name = "chatgpt-app-langsmith-tracing"
version = "0.1.0"
description = "Trace a ChatGPT app (an MCP server) into LangSmith, one run per tool call, threaded per conversation."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "python-dotenv>=1.0",
    "langsmith>=0.4",
]

[project.optional-dependencies]
harness = ["openai-agents>=0.22"]
