[project]
name = "chatgpt-app-langsmith-tracing-v1"
version = "0.1.0"
description = "Same tracing, for a plugin written against MCP Python SDK 1.x (FastMCP), the API OpenAI's Apps SDK examples use."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]
